# Fly.io config. See DEPLOY.md for the full flow.
# Quick start:
#   fly launch --no-deploy --copy-config        # creates the app from this file
#   fly postgres create --name goutreach-db      # managed Postgres
#   fly postgres attach goutreach-db             # sets DATABASE_URL
#   fly secrets set ANTHROPIC_API_KEY=sk-ant-... ENCRYPTION_KEY=$(openssl rand -hex 24) JWT_SECRET=$(openssl rand -hex 24)
#   fly secrets set APP_URL=https://<your-app>.fly.dev
#   fly deploy

app = "goutreach"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  HTTP_ADDR = ":8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
