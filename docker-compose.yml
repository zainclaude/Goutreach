services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: goutreach
      POSTGRES_PASSWORD: goutreach
      POSTGRES_DB: goutreach
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goutreach"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://goutreach:goutreach@db:5432/goutreach?sslmode=disable
      HTTP_ADDR: ":8080"
      APP_URL: ${APP_URL:-http://localhost:8080}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef}
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-jwt-secret-change-me}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-}
    ports:
      - "8080:8080"

volumes:
  pgdata:
